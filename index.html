<!DOCTYPE html>
<html dir="ltr" lang="en">
	<head>
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="description" content="RTL Markdown editor with live preview, local history, and HTML, Markdown, PDF, and image export">
		<meta name="keywords" content="RTL,Markdown,farsi,arabic,hebrew,persian,LTR,PDF,PNG,Karnoweb">
		<meta name="author" content="karnoweb">
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
		<meta name="robots" content="INDEX,FOLLOW">
		<meta name="color-scheme" content="light dark">

		<meta name="theme-color" content="#4361ee">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="apple-mobile-web-app-title" content="Markdown Tools">

		<title>Markdown Tools — Karnoweb</title>

		<script>
		(function () {
			var PREFS_VER = '3';
			try {
				if (localStorage.getItem('rtlmd-prefs-ver') !== PREFS_VER) {
					localStorage.setItem('rtlmd-theme', 'system');
					localStorage.setItem('rtlmd-dir', 'ltr');
					localStorage.setItem('rtlmd-prefs-ver', PREFS_VER);
				}
			} catch (e) { /* ignore */ }
			var themePref = localStorage.getItem('rtlmd-theme') || 'system';
			var theme = themePref;
			if (themePref === 'system') {
				theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'karnoweb-dark' : 'karnoweb';
			}
			document.documentElement.setAttribute('data-theme', theme);
			document.documentElement.setAttribute('dir', 'ltr');
			var fontSize = localStorage.getItem('rtlmd-font-size');
			if (fontSize === 'large') {
				document.documentElement.classList.add('font-large');
			}
			var mobile = matchMedia('(max-width: 768px)').matches;
			if (mobile || localStorage.getItem('rtlmd-sidebar') === '0') {
				document.documentElement.classList.add('sidebar-collapsed');
			}
		}());
		</script>

		<link rel="manifest" href="manifest.webmanifest">
		<link rel="icon" href="assets/pwa/icon-192.png" type="image/png">
		<link rel="apple-touch-icon" href="assets/pwa/icon-192.png">
		<link id="prism-theme" href="assets/vendor/prism/themes/prism-tomorrow.min.css" rel="stylesheet">
		<link href="assets/vendor/tailwind.css" rel="stylesheet">
		<link rel="stylesheet" href="app/css/style.css?v=6">
	</head>
	<body>

				</button>
				<a class="brand-lockup" href="https://karnoweb.ir" target="_blank" rel="noopener noreferrer">

					<span class="brand-copy">
						<h1 id="sitename">Markdown Tools</h1>
						<span class="brand-name">Karnoweb</span>
					</span>
				</a>
			</div>

			<div id="tools" class="toolbar app-bar-actions" role="toolbar" aria-label="Toolbar">

					<svg class="swap-off w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M20 6H9M20 12H4M20 18H9M9 8L5 12l4 4"/></svg>

					<svg class="swap-off fill-current w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Z"/></svg>
				</label>

				<label class="swap icon-btn" title="Zoom in text">
					<input type="checkbox" id="font-size-toggle" aria-label="Toggle font size">
					<svg class="swap-on w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16zM8 11h6"/></svg>
					<svg class="swap-off w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16zM11 8v6M8 11h6"/></svg>
				</label>

				<label class="swap icon-btn" title="Full preview">
					<input type="checkbox" id="fullview-toggle" aria-label="Full preview">
					<svg class="swap-on w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M6 18L18 6M6 6l12 12"/></svg>
					<svg class="swap-off w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5v-4m0 0h-4m4 0l-5-5"/></svg>
				</label>

				<label class="swap icon-btn" title="Sync scroll off">
					<input type="checkbox" id="scroll-sync-toggle" aria-label="Sync editor and preview scroll">
					<svg class="swap-on w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M9 4v16M15 4v16M6 8l3-3 3 3M12 8l3-3 3 3M6 16l3 3 3-3M12 16l3 3 3-3M10 12h4"/></svg>
					<svg class="swap-off w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M9 4v16M15 4v16M6 8l3-3 3 3M12 8l3-3 3 3M6 16l3 3 3-3M12 16l3 3 3-3"/></svg>
				</label>

				<label class="palette-wrap" for="palette-select" title="Color palette">
					<span class="sr-only">Palette</span>
					<select id="palette-select" class="select select-sm select-bordered" aria-label="Color palette">
						<option value="system" selected>System</option>
						<option value="karnoweb-dark">Pro Dark</option>
						<option value="karnoweb">Pro Light</option>
						<option value="dark">Dark</option>
						<option value="light">Light</option>
					</select>
				</label>

				<button type="button" id="pwa-install" class="icon-btn hidden" title="Install app" aria-label="Install app">
					<svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5m0 0l5-5m-5 5V4"/></svg>

			</div>
		</header>

		<div class="app-shell">
			<aside id="sidebar" class="sidebar" aria-label="File history">
				<div class="sidebar-head">
					<span class="sidebar-title">Files</span>
					<div class="sidebar-head-actions">
						<button type="button" id="doc-open" class="icon-btn-xs doc-open-btn" title="Open Markdown file" aria-label="Open Markdown file">
							<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 19a2 2 0 01-2-2V7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v1M5 19h14a2 2 0 002-2v-5a2 2 0 00-2-2H9l-2-2H5a2 2 0 00-2 2v7a2 2 0 002 2z"/></svg>
						</button>
						<button type="button" id="doc-new" class="icon-btn-xs doc-new-btn" title="New document" aria-label="New document">
							<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v14M5 12h14"/></svg>
						</button>
					</div>
					<input type="file" id="doc-file-input" class="sr-only" accept=".md,.markdown,.mdown,.mkd,.mkdn,text/markdown,text/x-markdown" tabindex="-1" aria-hidden="true">
				</div>
				<ul id="doc-list" class="doc-list" role="list"></ul>
				<p id="doc-empty" class="doc-empty hidden">No documents yet. Tap +.</p>
			</aside>

			<div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

			<div id="editor" class="workspace" dir="ltr">
				<div class="mobile-view-toggle" role="tablist" aria-label="Editor view">
					<button type="button" class="mobile-view-btn is-active" data-view="editor" role="tab" aria-selected="true">Edit</button>
					<button type="button" class="mobile-view-btn" data-view="preview" role="tab" aria-selected="false">Preview</button>
				</div>
				<div id="textbox" class="editor-pane">
					<div class="pane-header">
						<span>Editor</span>
						<span class="pane-header-actions">
							<span id="active-doc-title" class="pane-doc-title" title=""></span>
							<button type="button" id="doc-save" class="icon-btn-xs doc-save-btn" title="Save changes (Ctrl+S)" aria-label="Save changes">
								<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 21v-8H7v8M7 3v5h8M5 3h11l4 4v11a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2z"/></svg>
							</button>
						</span>
					</div>
					<div class="md-toolbar" role="toolbar" aria-label="Markdown formatting">
						<button type="button" class="md-tool" data-md="bold" title="Bold (Ctrl+B)"><strong>B</strong></button>
						<button type="button" class="md-tool" data-md="italic" title="Italic (Ctrl+I)"><em>I</em></button>
						<button type="button" class="md-tool" data-md="heading" title="Heading">H</button>
						<button type="button" class="md-tool" data-md="code" title="Inline code">&lt;/&gt;</button>
						<button type="button" class="md-tool" data-md="codeblock" title="Code block">{ }</button>
						<button type="button" class="md-tool" data-md="link" title="Link">Link</button>
						<button type="button" class="md-tool" data-md="ul" title="Bullet list">• List</button>
						<button type="button" class="md-tool" data-md="ol" title="Numbered list">1. List</button>
						<button type="button" class="md-tool" data-md="quote" title="Quote">“</button>
						<button type="button" class="md-tool" data-md="hr" title="Horizontal rule">—</button>
					</div>
					<textarea aria-label="Markdown editor" spellcheck="false"></textarea>
				</div>
				<div class="editor-pane editor-pane--preview">
					<div class="pane-header pane-header--preview">
						<span>Preview</span>
						<div class="export-actions" role="group" aria-label="Export">
							<button type="button" class="btn btn-xs btn-ghost" data-export="html" title="Download HTML">HTML</button>
							<button type="button" class="btn btn-xs btn-ghost" data-export="markdown" title="Download Markdown">Markdown</button>
							<button type="button" class="btn btn-xs btn-ghost" data-export="pdf" title="Print or save as PDF">PDF</button>
							<button type="button" class="btn btn-xs btn-ghost" data-export="image" title="Download PNG preview">Image</button>
						</div>
					</div>
					<div id="output" class="markdown-body"></div>
				</div>
			</div>
		</div>

		<script src="assets/vendor/prism/components/prism-json.min.js"></script>
		<script src="assets/vendor/prism/components/prism-sql.min.js"></script>
