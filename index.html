<!DOCTYPE html>
<html dir="rtl" lang="fa">
	<head>
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="description" content="ویرایشگر مارک‌داون راست‌به‌چپ با پیش‌نمایش زنده و خروجی HTML، Markdown و PDF">
		<meta name="keywords" content="RTL,Markdown,farsi,arabic,hebrew,persian,LTR,PDF">
		<meta name="author" content="karnoweb">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="robots" content="INDEX,FOLLOW">
		<meta name="color-scheme" content="light dark">

		<title>Markdown Tools — ویرایشگر مارک‌داون</title>

		<script>
		(function () {
			var themePref = localStorage.getItem('rtlmd-theme') || 'system';
			var theme = themePref;
			if (themePref === 'system') {
				theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
			}
			document.documentElement.setAttribute('data-theme', theme);
			document.documentElement.setAttribute('dir', 'rtl');
			var fontSize = localStorage.getItem('rtlmd-font-size');
			if (fontSize === 'large') {
				document.documentElement.classList.add('font-large');
			}
		}());
		</script>

		<link id="prism-theme" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet">
		<link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet">
		<script src="https://cdn.tailwindcss.com"></script>
		<link rel="stylesheet" href="app/css/style.css">
	</head>
	<body>
		<div id="header">
			<h1 id="sitename">Markdown Tools</h1>
			<p id="sitedescription">ویرایشگر مارک‌داون راست‌به‌چپ با پیش‌نمایش زنده</p>
		</div>

		<div id="tools" class="toolbar">
			<div class="btn-group btn-group-sm" role="group" aria-label="جهت متن">
				<button type="button" id="dir-rtl" class="btn btn-active" title="راست‌به‌چپ">RTL</button>
				<button type="button" id="dir-ltr" class="btn" title="چپ‌به‌راست">LTR</button>
			</div>

			<label class="swap swap-rotate btn btn-circle btn-sm btn-ghost" title="حالت روشن / تاریک">
				<input type="checkbox" id="theme-toggle" aria-label="تغییر حالت روشن و تاریک">
				<svg class="swap-on fill-current w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71A1,1,0,0,0,4.93,6.34Zm12,.29a1,1,0,0,0,.7-.29l.71-.71a1,1,0,1,0-1.41-1.41L17,5.64a1,1,0,0,0,0,1.41A1,1,0,0,0,17.66,7.34ZM21,11H20a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-9,8a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19ZM18.36,17A1,1,0,0,0,17,18.36l.71.71a1,1,0,0,0,1.41,0,1,1,0,0,0,0-1.41ZM12,6.5A5.5,5.5,0,1,0,17.5,12,5.51,5.51,0,0,0,12,6.5Zm0,9A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z"/></svg>
				<svg class="swap-off fill-current w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Z"/></svg>
			</label>

			<button type="button" id="font-size-toggle" class="btn btn-sm btn-ghost gap-1" title="اندازه متن بزرگ‌تر">
				<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7V4h3M4 17v3h3M20 7V4h-3M20 17v3h-3"/></svg>
				<span id="font-size-label">بزرگ</span>
			</button>

			<button type="button" id="fullview-toggle" class="btn btn-sm btn-outline gap-2" title="نمایش تمام‌صفحه نتیجه">
				<svg id="fullview-icon-expand" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5v-4m0 0h-4m4 0l-5-5"/></svg>
				<svg id="fullview-icon-collapse" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
				<span id="fullview-label">نمایش کامل</span>
			</button>

			<label class="flex items-center gap-2 text-sm opacity-80" for="palette-select">
				<span>پالت:</span>
				<select id="palette-select" class="select select-sm select-bordered w-auto max-w-[11rem]">
					<optgroup label="خودکار">
						<option value="system" selected>سیستم</option>
					</optgroup>
					<optgroup label="پایه">
						<option value="light">Light</option>
						<option value="dark">Dark</option>
					</optgroup>
					<optgroup label="روشن">
						<option value="cupcake">Cupcake</option>
						<option value="bumblebee">Bumblebee</option>
						<option value="emerald">Emerald</option>
						<option value="corporate">Corporate</option>
						<option value="retro">Retro</option>
						<option value="valentine">Valentine</option>
						<option value="garden">Garden</option>
						<option value="aqua">Aqua</option>
						<option value="lofi">Lo-Fi</option>
						<option value="pastel">Pastel</option>
						<option value="fantasy">Fantasy</option>
						<option value="wireframe">Wireframe</option>
						<option value="cmyk">CMYK</option>
						<option value="autumn">Autumn</option>
						<option value="acid">Acid</option>
						<option value="lemonade">Lemonade</option>
						<option value="winter">Winter</option>
					</optgroup>
					<optgroup label="تاریک">
						<option value="synthwave">Synthwave</option>
						<option value="cyberpunk">Cyberpunk</option>
						<option value="halloween">Halloween</option>
						<option value="forest">Forest</option>
						<option value="black">Black</option>
						<option value="luxury">Luxury</option>
						<option value="dracula">Dracula</option>
						<option value="business">Business</option>
						<option value="night">Night</option>
						<option value="coffee">Coffee</option>
						<option value="dim">Dim</option>
						<option value="nord">Nord</option>
						<option value="sunset">Sunset</option>
					</optgroup>
				</select>
			</label>
		</div>

		<div id="editor" dir="rtl">
			<div id="textbox" class="editor-pane">
				<div class="pane-header">ویرایش</div>
				<textarea aria-label="ویرایشگر مارک‌داون" spellcheck="false"></textarea>
			</div>
			<div class="editor-pane editor-pane--preview">
				<div class="pane-header pane-header--preview">
					<span>پیش‌نمایش</span>
					<div class="export-actions" role="group" aria-label="خروجی گرفتن از نتیجه">
						<button type="button" class="btn btn-xs btn-ghost" data-export="html" title="دانلود HTML نتیجه">HTML</button>
						<button type="button" class="btn btn-xs btn-ghost" data-export="markdown" title="دانلود Markdown">Markdown</button>
						<button type="button" class="btn btn-xs btn-ghost" data-export="pdf" title="چاپ یا ذخیره نتیجه به صورت PDF">PDF</button>
					</div>
				</div>
				<div id="output" class="markdown-body"></div>
			</div>
		</div>

		<div id="footer">
			<p><a href="https://github.com/karnoweb/markdown-tools">karnoweb/markdown-tools</a></p>
		</div>

		<script src="assets/marked/marked.min.js"></script>
		<script src="assets/jquery/dist/jquery.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-clike.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-markup.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-markup-templating.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-php.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-sql.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
		<script>Prism.plugins.autoloader.languages_path = 'https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/';</script>
		<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.0/dist/mermaid.min.js"></script>
		<script src="app/js/rtlmd.js"></script>
	</body>
</html>
