<!DOCTYPE html>
<html dir="rtl" lang="en">
	<head>
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="description" content="RTL Markdown editor with live preview, local history, and HTML, Markdown, PDF, and image export">
		<meta name="keywords" content="RTL,Markdown,farsi,arabic,hebrew,persian,LTR,PDF,PNG,Karnoweb">
		<meta name="author" content="karnoweb">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="robots" content="INDEX,FOLLOW">
		<meta name="color-scheme" content="light dark">

		<title>Markdown Tools — Karnoweb</title>

		<script>
		(function () {
			var themePref = localStorage.getItem('rtlmd-theme') || 'karnoweb-dark';
			var theme = themePref;
			if (themePref === 'system') {
				theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'karnoweb-dark' : 'karnoweb';
			}
			document.documentElement.setAttribute('data-theme', theme);
			document.documentElement.setAttribute('dir', 'rtl');
			var fontSize = localStorage.getItem('rtlmd-font-size');
			if (fontSize === 'large') {
				document.documentElement.classList.add('font-large');
			}
			if (localStorage.getItem('rtlmd-sidebar') === '0') {
				document.documentElement.classList.add('sidebar-collapsed');
			}
		}());
		</script>

		<link id="prism-theme" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet">
		<link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet">
		<script src="https://cdn.tailwindcss.com"></script>
		<link rel="stylesheet" href="app/css/style.css">
	</head>
	<body>
		<header id="header" class="app-bar">
			<div class="app-bar-start">
				<button type="button" id="sidebar-toggle" class="icon-btn" title="Toggle files" aria-controls="sidebar" aria-expanded="true">
					<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M4 6h16M4 12h10M4 18h16"/></svg>
				</button>
				<a class="brand-lockup" href="https://karnoweb.ir" target="_blank" rel="noopener noreferrer">
					<img class="brand-logo" src="assets/brand/karnoweb-logo.png" width="36" height="36" alt="Karnoweb">
					<span class="brand-copy">
						<h1 id="sitename">Markdown Tools</h1>
						<span class="brand-name">Karnoweb</span>
					</span>
				</a>
			</div>

			<div id="tools" class="toolbar app-bar-actions" role="toolbar" aria-label="Toolbar">
				<div class="dir-toggle" role="group" aria-label="Text direction">
					<button type="button" id="dir-rtl" class="icon-btn btn-active" title="Right to left" aria-label="Right to left">RTL</button>
					<button type="button" id="dir-ltr" class="icon-btn" title="Left to right" aria-label="Left to right">LTR</button>
				</div>

				<label class="swap swap-rotate icon-btn" title="Light / dark mode">
					<input type="checkbox" id="theme-toggle" aria-label="Toggle light and dark mode">
					<svg class="swap-on fill-current w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71A1,1,0,0,0,4.93,6.34Zm12,.29a1,1,0,0,0,.7-.29l.71-.71a1,1,0,1,0-1.41-1.41L17,5.64a1,1,0,0,0,0,1.41A1,1,0,0,0,17.66,7.34ZM21,11H20a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-9,8a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19ZM18.36,17A1,1,0,0,0,17,18.36l.71.71a1,1,0,0,0,1.41,0,1,1,0,0,0,0-1.41ZM12,6.5A5.5,5.5,0,1,0,17.5,12,5.51,5.51,0,0,0,12,6.5Zm0,9A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z"/></svg>
					<svg class="swap-off fill-current w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Z"/></svg>
				</label>

				<button type="button" id="font-size-toggle" class="icon-btn" title="Font size">
					<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M4 20V4h2.4l7.2 12.2V4H16v16h-2.4L6.4 7.8V20H4z"/></svg>
					<span class="sr-only" id="font-size-label">Large</span>
				</button>

				<button type="button" id="fullview-toggle" class="icon-btn" title="Full preview">
					<svg id="fullview-icon-expand" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5v-4m0 0h-4m4 0l-5-5"/></svg>
					<svg id="fullview-icon-collapse" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M6 18L18 6M6 6l12 12"/></svg>
					<span class="sr-only" id="fullview-label">Full preview</span>
				</button>

				<label class="palette-wrap" for="palette-select" title="Color palette">
					<span class="sr-only">Palette</span>
					<select id="palette-select" class="select select-sm select-bordered" aria-label="Color palette">
						<option value="karnoweb-dark" selected>Pro Dark</option>
						<option value="karnoweb">Pro Light</option>
						<option value="system">System</option>
						<option value="dark">Dark</option>
						<option value="light">Light</option>
					</select>
				</label>
			</div>
		</header>

		<div class="app-shell">
			<aside id="sidebar" class="sidebar" aria-label="File history">
				<div class="sidebar-head">
					<span class="sidebar-title">Files</span>
					<button type="button" id="doc-new" class="btn btn-xs btn-primary" title="New document">New</button>
				</div>
				<ul id="doc-list" class="doc-list" role="list"></ul>
				<p id="doc-empty" class="doc-empty hidden">No documents yet. Click New.</p>
			</aside>

			<div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

			<div id="editor" class="workspace" dir="rtl">
				<div id="textbox" class="editor-pane">
					<div class="pane-header">
						<span>Editor</span>
						<span id="active-doc-title" class="pane-doc-title" title=""></span>
					</div>
					<textarea aria-label="Markdown editor" spellcheck="false"></textarea>
				</div>
				<div class="editor-pane editor-pane--preview">
					<div class="pane-header pane-header--preview">
						<span>Preview</span>
						<div class="export-actions" role="group" aria-label="Export">
							<button type="button" class="btn btn-xs btn-ghost" data-export="html" title="Download HTML">HTML</button>
							<button type="button" class="btn btn-xs btn-ghost" data-export="markdown" title="Download Markdown">Markdown</button>
							<button type="button" class="btn btn-xs btn-ghost" data-export="pdf" title="Print or save as PDF">PDF</button>
							<button type="button" class="btn btn-xs btn-ghost" data-export="image" title="Download PNG preview">Image</button>
						</div>
					</div>
					<div id="output" class="markdown-body"></div>
				</div>
			</div>
		</div>

		<script src="assets/marked/marked.min.js"></script>
		<script src="assets/jquery/dist/jquery.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-clike.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-markup.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-markup-templating.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-php.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-sql.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
		<script>Prism.plugins.autoloader.languages_path = 'https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/';</script>
		<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.0/dist/mermaid.min.js"></script>
		<script src="app/js/rtlmd.js"></script>
	</body>
</html>
