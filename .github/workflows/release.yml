name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            name: windows
          - os: ubuntu-latest
            script: dist:linux
            name: linux
          - os: macos-latest
            script: dist:mac
            name: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Build Windows / Linux
        if: matrix.name != 'mac'
        run: npm run ${{ matrix.script }} -- --publish never

      - name: Build macOS
        if: matrix.name == 'mac'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "${CSC_LINK:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            echo "Signing + notarizing macOS build"
            npm run dist:mac -- --publish never
          else
            echo "::warning::Mac signing/notarization secrets missing — building unsigned. Downloaded DMGs will show Gatekeeper 'damaged' errors. Add CSC_LINK, CSC_KEY_PASSWORD, and notarization secrets (see build/mac-release.env.example)."
            npm run dist:mac:unsigned -- --publish never
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release with download links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          link() { # $1 = label, $2 = glob
            for f in $2; do
              [ -e "$f" ] && echo "- **$1:** [$(basename "$f")](${BASE}/$(basename "$f"))"
            done
          }
          {
            echo "## Downloads"
            echo
            echo "### Windows"
            link "Installer" "artifacts/windows/*-win-setup.exe"
            link "Portable" "artifacts/windows/*-win-portable.exe"
            echo
            echo "### Linux"
            link "AppImage" "artifacts/linux/*.AppImage"
            link "Debian/Ubuntu (.deb)" "artifacts/linux/*.deb"
            echo
            echo "### macOS"
            link "DMG" "artifacts/mac/*.dmg"
            echo
            echo "## Notes"
            echo
            echo "- Web/PWA: pull and hard-refresh."
            echo "- macOS release builds require Developer ID signing + notarization (CI secrets). Unsigned mac builds are blocked by Gatekeeper when downloaded."
            echo "- Windows builds are unsigned; the OS may show a security warning on first launch."
          } > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md artifacts/*/*
