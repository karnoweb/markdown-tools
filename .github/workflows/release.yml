name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            name: windows
          - os: ubuntu-latest
            script: dist:linux
            name: linux
          - os: macos-latest
            script: dist:mac
            name: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate icon.icns (macOS)
        if: matrix.name == 'mac'
        run: |
          npm run icons
          mkdir build/icon.iconset
          for s in 16 32 64 128 256 512; do
            sips -z $s $s build/icon.png --out build/icon.iconset/icon_${s}x${s}.png
          done
          cp build/icon.iconset/icon_32x32.png build/icon.iconset/icon_16x16@2x.png
          cp build/icon.iconset/icon_64x64.png build/icon.iconset/icon_32x32@2x.png
          cp build/icon.iconset/icon_256x256.png build/icon.iconset/icon_128x128@2x.png
          cp build/icon.iconset/icon_512x512.png build/icon.iconset/icon_256x256@2x.png
          rm build/icon.iconset/icon_64x64.png
          iconutil -c icns build/icon.iconset -o build/icon.icns
          # file-association icon would collide with the app icon on mac (EEXIST) — CI-only tweak
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.build.fileAssociations.forEach(a=>delete a.icon);fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
      - run: npm run ${{ matrix.script }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release with download links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          link() { # $1 = label, $2 = glob
            for f in $2; do
              [ -e "$f" ] && echo "- **$1:** [$(basename "$f")](${BASE}/$(basename "$f"))"
            done
          }
          {
            echo "## Downloads"
            echo
            echo "### Windows"
            link "Installer" "artifacts/windows/*-win-setup.exe"
            link "Portable" "artifacts/windows/*-win-portable.exe"
            echo
            echo "### Linux"
            link "AppImage" "artifacts/linux/*.AppImage"
            link "Debian/Ubuntu (.deb)" "artifacts/linux/*.deb"
            echo
            echo "### macOS"
            link "DMG" "artifacts/mac/*.dmg"
            echo
            echo "## Notes"
            echo
            echo "- Web/PWA: pull and hard-refresh."
            echo "- macOS/Windows builds are unsigned; the OS may show a security warning on first launch."
          } > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md artifacts/*/*
